# SolarPilot – Start mit: docker compose up -d   →   http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: solarpilot-backend:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SOLARPILOT_DATA_DIR: /data
    volumes:
      - solarpilot-data:/data
      # Optional: eigene Konfigurationsdatei (siehe config/sites.example.yaml)
      # - ./config/sites.yaml:/app/config/sites.yaml:ro
    # Für Modbus/UDP-Geräte im Heimnetz ist kein Port-Mapping nötig (ausgehende Verbindungen).
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: solarpilot-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${SOLARPILOT_PORT:-8080}:80"

volumes:
  solarpilot-data:
