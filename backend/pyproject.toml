[project]
name = "solarpilot"
version = "1.0.0"
description = "Open-Source-Dashboard für PV-Anlagen mehrerer Hersteller"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pymodbus>=3.7",
    "cryptography>=43",
    "pyjwt>=2.9",
    "pyyaml>=6",
    "feedparser>=6.0.11",
    "paho-mqtt>=2.1",
    "fpdf2>=2.8",
    "goodwe>=0.4",
    "tzdata>=2024.1",
    "anthropic>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008", "S311", "SIM105", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
